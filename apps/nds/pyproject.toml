[project]
name = "nds"
version = "0.1.0"
description = "NeoRisk data storage: park large datasets outside Git, keep them reachable by symlink"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
nds = "nds.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
