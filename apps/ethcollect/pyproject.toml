[project]
name = "ethcollect"
version = "0.1.0"
description = "Ethereum data collection: one connector per source, three shared tables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "polars>=1.0", "pyarrow>=15", "pyyaml>=6"]

[project.scripts]
eth-collect = "ethcollect.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
