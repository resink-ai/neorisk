[project]
name = "dataset"
version = "0.1.0"
description = "Validation datasets: one ordered event log in, expected tables out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["neorisk-simkit", "refdata", "polars>=1.0", "pyarrow>=17", "duckdb>=1.1"]

[project.scripts]
dataset = "dataset.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
neorisk-simkit = { workspace = true }
refdata = { workspace = true }
