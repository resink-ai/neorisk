[project]
name = "devicefp"
version = "0.1.0"
description = "Device fingerprinting model: euclidean embeddings of device profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "polars>=1.0", "pyarrow>=15", "scipy>=1.11", "torch>=2.4"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
devicefp = "devicefp.cli:main"
