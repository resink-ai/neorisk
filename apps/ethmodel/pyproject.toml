[project]
name = "ethmodel"
version = "0.1.0"
description = "Ethereum bad-address model v0: pre-trained transfer encoder, PU head, label expansion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["bench", "numpy>=1.26", "polars>=1.0", "pyarrow>=15", "scikit-learn>=1.4",
                "torch>=2.4"]

[project.scripts]
ethmodel = "ethmodel.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
bench = { workspace = true }
