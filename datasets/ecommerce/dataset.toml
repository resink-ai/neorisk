name = "ecommerce"
version = "v1"
kind = "synthetic"

[recipe]
project = "examples/ecommerce"
profile = "sample"
seed = 7
overlay = []
designs = ["star", "dv", "an"]

# event -> payload column whose value keys its messages (the reservation_* events of
# std.reservations keep the default partition owner)
[recipe.owners]
user_signed_up = "user_id"
verification_failed = "user_id"
session_started = "user_id"
product_viewed = "user_id"
order_placed = "user_id"
checkout_failed = "user_id"
order_returned = "user_id"
address_changed = "user_id"
referral_bonus_paid = "user_id"
referral_bonus_rejected = "user_id"
stock_restocked = "sku_id"

# ---- star ----------------------------------------------------------------------------

[[check]]
table = "star_dim_users"
simkit = "users"
columns = { user_id = "user_id", age_band = "age_band", region = "region", acquisition = "acquisition", invited_by = "invited_by", valid_from = "created_at" }
where = "users_sk IN (SELECT min(users_sk) FROM star_dim_users GROUP BY user_id)"

[[check]]
table = "star_dim_users"
simkit = "address_changed"
columns = { user_id = "user_id", region = "region", valid_from = "event_time" }
where = "users_sk NOT IN (SELECT min(users_sk) FROM star_dim_users GROUP BY user_id)"

[[check]]
table = "star_dim_devices"
simkit = "devices"
columns = { device_id = "device_id", user_id = "user_id", os = "os", kind = "kind", created_at = "created_at" }

[[check]]
table = "star_dim_skus"
simkit = "skus"
columns = { sku_id = "sku_id", category = "category", price = "price", created_at = "created_at" }

[[check]]
table = "star_fact_orders"
simkit = "order_placed"
columns = { order_id = "order_id", user_id = "user_id", device_id = "device_id", first_sku_id = "sku_id", first_quantity = "quantity", amount = "amount", ordered_at = "event_time" }

[[check]]
table = "star_fact_orders"
simkit = "orders"
columns = { order_id = "order_id", user_id = "user_id", lines = "lines", amount = "amount", ordered_at = "created_at" }

[[check]]
table = "star_fact_order_lines"
simkit = "order_lines"
columns = { line_id = "line_id", order_id = "order_id", sku_id = "sku_id", quantity = "quantity", amount = "amount", ordered_at = "created_at" }

[[check]]
table = "star_fact_sessions"
simkit = "session_started"
columns = { session_id = "session_id", user_id = "user_id", device_id = "device_id", started_at = "event_time" }

[[check]]
table = "star_fact_product_views"
simkit = "product_viewed"
columns = { view_id = "event_id", session_id = "session_id", user_id = "user_id", device_id = "device_id", sku_id = "sku_id", viewed_at = "event_time" }

[[check]]
table = "star_fact_returns"
simkit = "order_returned"
columns = { return_id = "event_id", order_id = "order_id", user_id = "user_id", amount = "amount", returned_at = "event_time" }

[[check]]
table = "star_fact_referral_bonus"
simkit = "referral_bonus_paid"
columns = { bonus_id = "event_id", inviter_id = "user_id", invitee_id = "invitee_id", amount = "amount", decided_at = "event_time" }
where = "outcome = 'paid'"

[[check]]
table = "star_fact_referral_bonus"
simkit = "referral_bonus_rejected"
columns = { bonus_id = "event_id", inviter_id = "user_id", invitee_id = "invitee_id", decided_at = "event_time" }
where = "outcome = 'rejected'"

