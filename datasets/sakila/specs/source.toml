# Sakila: MySQL's sample (BSD) in a SQLite port; Spider2's Pagila.sqlite is the same file.
file = "sqlite-sakila.sqlite"
note = "Times end in '.000', read as UTC. last_update is the 2021 load clock; triggers are not replayed."

[tables]
actor = ["actor_id"]
country = ["country_id"]
city = ["city_id"]
address = ["address_id"]
language = ["language_id"]
category = ["category_id"]
customer = ["customer_id"]
film = ["film_id"]
film_actor = ["actor_id", "film_id"]
film_category = ["film_id", "category_id"]
film_text = ["film_id"]
inventory = ["inventory_id"]
staff = ["staff_id"]
store = ["store_id"]
payment = ["payment_id"]
rental = ["rental_id"]
