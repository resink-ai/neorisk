# oraclesql: the PRACTICAL schema of Practical Oracle SQL (Kim Berg Hansen, Apress 2020),
# from Apress/practical-oracle-sql's practical_fill_schema.sql. Freeware licence: local only.
file = "oracle_sql.sqlite"
note = "Dates and datetimes read as UTC; beat_time has no seconds. 11 views, replayed; 5 empty tables."

[tables]
customers = ["id"]
conway_gen_zero = ["x", "y"]
web_devices = ["day"]
web_demographics = ["day"]
channels_dim = ["id"]
gender_dim = ["letter"]
packaging = ["id"]
packaging_relations = ["packaging_id", "contains_id"]
product_groups = ["id"]
products = ["id"]
monthly_sales = ["product_id", "mth"]
breweries = ["id"]
purchases = ["id"]
product_alcohol = ["product_id"]
customer_favorites = ["customer_id"]
customer_reviews = ["customer_id"]
locations = ["id"]
inventory = ["id"]
orders = ["id"]
orderlines = ["id"]
monthly_budget = ["product_id", "mth"]
product_minimums = ["product_id"]
stock = ["symbol"]
ticker = ["symbol", "day"]
web_apps = ["id"]
web_pages = ["app_id", "page_no"]
web_counter_hist = ["app_id", "page_no", "day"]
server_heartbeat = ["server", "beat_time"]
web_page_visits = ["client_ip", "visit_time"]
employees = ["id"]
emp_hire_periods = ["emp_id", "start_"]
picking_list = ["id"]
picking_line = ["picklist_id", "line_no"]
picking_log = ["picklist_id", "log_time"]
id_name_type = ["id"]
id_name_coll_type = ["collection_id"]
id_name_coll_entries = ["collection_id", "id"]
favorite_coll_type = ["id"]
