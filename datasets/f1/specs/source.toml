# F1: the Ergast Developer API database (1950 to 2024-07-07) with Spider2's 15 added tables.
file = "f1.sqlite"
note = "Dates and UTC start times as given; untimed facts are stamped by rule (see CONTEXT.md)."

[tables]
circuits = ["circuit_id"]
constructor_results = ["constructor_results_id"]
constructor_standings = ["constructor_standings_id"]
constructors = ["constructor_id"]
driver_standings = ["driver_standings_id"]
drivers = ["driver_id"]
lap_times = ["race_id", "driver_id", "lap"]
pit_stops = ["race_id", "driver_id", "stop"]
qualifying = ["qualify_id"]
races = ["race_id"]
results = ["result_id"]
seasons = ["year"]
status = ["status_id"]
sprint_results = ["result_id"]
short_grand_prix_names = ["full_name"]
short_constructor_names = ["constructor_ref"]
liveries = ["constructor_ref", "start_year", "end_year"]
tdr_overrides = ["year", "constructor_ref", "driver_ref"]
circuits_ext = ["circuit_id"]
constructors_ext = ["constructor_id"]
drivers_ext = ["driver_id"]
races_ext = ["race_id"]
driver_standings_ext = ["race_id", "driver_id"]
lap_times_ext = ["race_id", "driver_id", "lap"]
lap_time_stats = ["race_id", "driver_id"]
team_driver_ranks = ["year", "constructor_id", "driver_id"]
drives = ["year", "driver_id", "first_round"]
retirements = ["race_id", "driver_id"]
lap_positions = ["race_id", "driver_id", "lap"]
