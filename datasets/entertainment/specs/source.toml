# entertainment: the Entertainment Agency sample database of Viescas and Hernandez, *SQL
# Queries for Mere Mortals*, as Spider2's EntertainmentAgency.sqlite.
file = "EntertainmentAgency.sqlite"
note = "Dates and times are text, read as UTC. The four ztbl* helpers are generated by build.sql."

[tables]
Agents = ["AgentID"]
Entertainers = ["EntertainerID"]
Members = ["MemberID"]
Entertainer_Members = ["EntertainerID", "MemberID"]
Musical_Styles = ["StyleID"]
Entertainer_Styles = ["EntertainerID", "StyleID"]
Customers = ["CustomerID"]
Musical_Preferences = ["CustomerID", "StyleID"]
Engagements = ["EngagementNumber"]
ztblDays = ["DateField"]
ztblWeeks = ["WeekStart"]
ztblMonths = ["YearNumber", "MonthNumber"]
ztblSkipLabels = ["LabelCount"]
