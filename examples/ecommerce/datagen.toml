# datagen project file. Paths are relative to this file.
# `datagen run examples/ecommerce --profile <name>` merges [defaults] <- [profiles.<name>] <- --set.

[project]
name = "ecommerce"
pack = "specs/pack.py"                 # define(p, cfg) and Config
expectations = "specs/expectations.yaml"
overlays = "specs/overlays"            # one module per overlay; apply(o, **params)

[paths]
out = "out"                            # out/<run>/          datasets
reports = "reports"                    # reports/<run>/      report.html, checks.json, extracts
logs = "logs"                          # logs/<run>-<utc>.jsonl

[defaults]
seed = 42
start = "2026-01-01T00:00:00Z"
mode = "time"                          # time | population
span = "90d"
warmup = "14d"                         # generated, not exported; opening snapshot at the end
drain = "0d"                           # open cases at the horizon are censored

[budget]                               # validate refuses a run whose hard caps exceed this
threads = 16
memory = "16GB"
max_step_rows = 4_000_000
max_spawn_depth = 3
max_admissions_per_step = 200_000

[writer]                               # pinned: affects bytes
compression = "zstd"
compression_level = 3
row_group_rows = 131_072

[profiles.sample]                      # the authoring loop: seconds, not minutes
span = "21d"
warmup = "3d"
set = { users = 20_000, skus = 5_000, sku_groups = 64 }

[profiles.full]                        # matches the S1 benchmark shape
set = { users = 2_000_000, skus = 50_000, sku_groups = 512 }

[profiles.abuse]                       # base + both overlays, for fraud benchmarks
set = { users = 2_000_000 }
overlays = ["bounty_hunters", "flash_sale"]

[profiles.abuse.overlay.bounty_hunters]
size = 500
share_device = 0.75

[profiles.abuse.overlay.flash_sale]
day = "day 60"
category = "electronics"

[export]
golden = ["device_distinct_users_24h", "user_orders_7d"]   # written to golden/, never events/
snapshots = true
cases = true

[replay.presets.peek]
first = 100
sink = "stdout:?format=table"

[replay.presets.last_json]
last = 100
sink = "file:last100.json?format=json-array"

[replay.presets.kafka_dev]
first = 10_000
sink = "kafka://localhost:9092/ecom.{event_type}?key=user_id&format=avro"
schema_registry = "http://localhost:8081"
pace = "x60"
rebase = "now"
