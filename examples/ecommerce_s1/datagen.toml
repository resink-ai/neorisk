# S1 slice of the e-commerce project (spec §18 S1). Same layout as examples/ecommerce.
[project]
name = "ecommerce_s1"
pack = "specs/pack.py"

[paths]
out = "out"
reports = "reports"
logs = "logs"

[defaults]
seed = 42
start = "2026-01-01T00:00:00Z"
mode = "time"
span = "90d"
warmup = "14d"

[budget]
threads = 16
memory = "16GB"
max_step_rows = 4_000_000
max_step_bytes = "1GB"
max_spawn_depth = 3
max_admissions_per_step = 200_000

[writer]
compression = "zstd"
compression_level = 3
row_group_rows = 131_072

[engine]
step = "1d"
step_min = "1h"
step_max = "7d"
adapt = true
slab_bytes = "8MB"
timer_nodes = 12_000_000
payload_slots = 2_000_000
max_messages_per_step = 4_000_000
parallel_min_partitions = 2_048

[profiles.sample]
span = "21d"
warmup = "3d"
set = { users = 20_000, skus = 5_000, sku_groups = 64 }

[profiles.full]                        # the S1 benchmark shape (benchmarks/s1.toml)
# Journey calibrated so 2M users over 90 days export ~10^7 events with ~8% of owner commands
# being inventory reserves (spec §10); see benchmarks/README.md.
[profiles.full.set]
users = 2_000_000
skus = 50_000
sku_groups = 512
journey = { session_gap_min_h = 2_300.0, views_mean = 4.0, add_to_cart_p = 0.4, checkout_p = 0.85 }
# signup_delay = exp(mean 7 days), in microseconds: spreads the 1.2M initial shoppers' first
# sessions over the warm-up so the first step stays under budget.max_step_rows.
"journey.signup_delay.params" = [604_800_000_000.0, 0.0, 0.0]

[replay.presets.peek]
first = 100
sink = "stdout:?format=table"

[replay.presets.last_json]
last = 100
sink = "file:last100.json?format=json-array"
