# datagen project file. Paths are relative to this file.
# `datagen run examples/crypto_exchange --profile <name>` merges [defaults] <- [profiles.<name>] <- --set.

[project]
name = "crypto_exchange"
pack = "specs/pack.py"                 # define(p, cfg) and Config
expectations = "specs/expectations.yaml"
overlays = "specs/overlays"            # one module per overlay; apply(o, **params)

[paths]
out = "out"                            # out/<run>/          datasets
reports = "reports"                    # reports/<run>/      report.html, checks.json, extracts
logs = "logs"                          # logs/<run>-<utc>.jsonl

[defaults]
seed = 42
start = "2026-03-02T00:00:00Z"
mode = "time"                          # time | population
span = "30d"
warmup = "7d"                          # generated, not exported; books and balances fill up
drain = "0d"                           # open orders at the horizon are censored

[budget]                               # validate refuses a run whose hard caps exceed this
threads = 16
memory = "32GB"                        # 40 books × 250k resting slots + 1M traders' balances
max_step_rows = 4_000_000
max_spawn_depth = 3
max_admissions_per_step = 200_000
max_continuations_per_command = 4_096  # 4,096 × 64 fills; a longer sweep fails the run

[writer]                               # pinned: affects bytes
compression = "zstd"
compression_level = 3
row_group_rows = 131_072

[profiles.sample]                      # the authoring loop: seconds, not minutes
span = "7d"
warmup = "2d"
set = { traders = 20_000, symbols = 40, "mm.accounts" = 20 }

[profiles.full]                        # shard-dominated benchmark shape
set = { traders = 1_000_000, symbols = 40 }

[profiles.external]                    # fidelity switch: no market makers, external curve fills
set = { traders = 200_000, "matching.fidelity" = "external_liquidity" }

[profiles.abuse]                       # base + both overlays, for surveillance benchmarks
set = { traders = 1_000_000 }
overlays = ["wash_traders", "pump_and_dump"]

[profiles.abuse.overlay.wash_traders]
size = 60
share_ip = 0.95

[profiles.abuse.overlay.pump_and_dump]
size = 8
followers = 0.004

[export]
golden = ["device_distinct_traders_24h", "ip_distinct_traders_24h", "trader_notional_24h",
          "counterparty_top_share_7d"]                     # written to golden/, never events/
snapshots = true
cases = true
timelines = ["ref_price"]              # exogenous reference prices -> relations/ref_price/

[replay.presets.peek]
first = 100
sink = "stdout:?format=table"

[replay.presets.last_json]
last = 100
sink = "file:last100.json?format=json-array"

# One key for every topic: partition_id. Trader events are emitted by the trader owner, so they
# are keyed by trader; book events (trade, order_accepted, book_ticker, ...) by their symbol's
# book shard. Each trader's history and each symbol's tape stay ordered in one Kafka partition.
[replay.presets.kafka_dev]
first = 10_000
sink = "kafka://localhost:9092/cex.{event_type}?key=partition_id&format=avro"
schema_registry = "http://localhost:8081"
pace = "x60"
rebase = "now"
