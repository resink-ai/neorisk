# datagen project file. Paths are relative to this file.
# `datagen run examples/social --profile <name>` merges [defaults] <- [profiles.<name>] <- --set.

[project]
name = "social"
pack = "specs/pack.py"                 # define(p, cfg) and Config
expectations = "specs/expectations.yaml"
overlays = "specs/overlays"            # one module per overlay; apply(o, **params)

[paths]
out = "out"                            # out/<run>/          datasets
reports = "reports"                    # reports/<run>/      report.html, checks.json, extracts
logs = "logs"                          # logs/<run>-<utc>.jsonl

[defaults]
seed = 42
start = "2026-01-05T00:00:00Z"         # a Monday: weekly graph epochs start on Mondays
mode = "time"                          # time | population
span = "84d"                           # 12 graph epochs
warmup = "14d"                         # generated, not exported: two epochs of follows settle
drain = "0d"                           # cascades open at the horizon are censored

[budget]                               # validate refuses a run whose hard caps exceed this
threads = 16
memory = "24GB"                        # follow graph CSR (both views) counts as resident
max_step_rows = 4_000_000
max_step = "1h"                        # steps also align to every follow_graph/account_status rebuild
max_spawn_depth = 3
max_admissions_per_step = 200_000

[writer]                               # pinned: affects bytes
compression = "zstd"
compression_level = 3
row_group_rows = 131_072

[profiles.sample]                      # the authoring loop: seconds, not minutes
span = "21d"
warmup = "7d"
set = { users = 20_000, "moderation.queues" = 1, "cascade.max_live" = 40_000 }

[profiles.full]                        # ~2M accounts, ~10^8 events over 84 days
set = { users = 2_000_000, "moderation.queues" = 8, "cascade.max_live" = 4_000_000 }

[profiles.abuse]                       # base + bot farm, for coordinated-behavior benchmarks
set = { users = 2_000_000, "moderation.queues" = 8, "cascade.max_live" = 4_000_000 }
overlays = ["bot_farm"]

[profiles.abuse.overlay.bot_farm]
size = 120                             # campaigns; ~10k bots at the default bots mean
arrive = "burst(start='day 10', span='50d')"
amplify_p = 0.85
spam_p = 0.6

[export]
golden = ["post_distinct_reposters_60s", "content_hash_distinct_users_24h", "user_follows_1h"]
snapshots = true                       # opening state includes the epoch-0 follow graph
cases = true
relations = ["follow_graph"]           # each epoch's edge list to relations/, never events/

[replay.presets.peek]
first = 100
sink = "stdout:?format=table"

[replay.presets.last_json]
last = 100
sink = "file:last100.json?format=json-array"

# Keyed by user_id: every event table carries the acting (or reviewed) account as user_id, so
# a consumer that builds per-account features (spam, bot, velocity models) sees each account's
# actions in one Kafka partition, in canonical order. Keying by post_id would keep a cascade
# together but scatter each account's history. graph_epoch_built has no user_id; it is left out.
[replay.presets.kafka_dev]
first = 10_000
types = ["user_signed_up", "session_started", "post_created", "follow", "unfollow",
         "account_suspended", "impression_sampled", "like", "reply", "repost",
         "content_reported", "cascade_closed", "moderation_decision"]
sink = "kafka://localhost:9092/sns.{event_type}?key=user_id&format=avro"
schema_registry = "http://localhost:8081"
pace = "x60"
rebase = "now"
