# Statistical expectations and laws for the social pack.
# Every entry cites where its target comes from. Changes to this file need a second
# reviewer (CODEOWNERS). Exact laws are declared in pack.py with p.check and listed
# here only by id, so the report shows one table.
pack: social
schema_version: 1

defaults:
  min_sample: 2000          # cases; smaller samples make a check inconclusive
  confidence: 0.95
  sample_by: owner_hash     # stratified; rare cohorts get at least min_sample cases
  graph_sample: nodes       # graph metrics: exact degrees, node sampling for the rest

laws:                       # declared in pack.py; required means CI fails if missing
  - {id: chk.repost_parent_in_cascade,   required: true}
  - {id: chk.repost_once_per_user,       required: true}
  - {id: chk.cascade_caps,               required: true}
  - {id: chk.suspended_silent,           required: true}
  - {id: chk.suspended_silent_in_feeds,  required: true}
  - {id: chk.decision_after_report,      required: true}
  - {id: chk.decision_once,              required: true}
  - {id: chk.follow_alternates,          required: true}
  - {id: chk.closed_cascade_silent,      required: true}

expectations:
  # ------------------------------------------------------------ follow graph (last epoch)
  - id: exp.in_degree_tail
    metric: stat.graph.degree_tail("follow_graph", direction="in", epoch="last", xmin="fit")
    target: {between: [1.9, 2.6]}
    source: "brief: Rates we know, row 1 (Kwak et al. 2010)"
    required: true

  - id: exp.out_degree_tail
    metric: stat.graph.degree_tail("follow_graph", direction="out", epoch="last", xmin="fit",
                                   xmax=5000)
    target: {between: [2.0, 3.0]}
    source: "brief: Rates we know, row 2"

  - id: exp.reciprocity
    metric: stat.graph.reciprocity("follow_graph", epoch="last")
    target: {between: [0.18, 0.30]}
    source: "brief: Rates we know, row 3 (Kwak et al. 2010, 22.1%)"
    required: true

  # ------------------------------------------------------------ cascades (closed ones)
  - id: exp.cascade_no_repost
    metric: stat.share("cascade_closed", of=["cascade_closed"], where="reposts == 0")
    target: {between: [0.90, 0.97]}
    source: "brief: Rates we know, row 4 (Goel et al. 2012, 2016)"
    required: true

  - id: exp.cascade_large
    metric: stat.share("cascade_closed", of=["cascade_closed"], where="reposts >= 100")
    target: {lt: 0.001}
    source: "brief: Rates we know, row 5"
    required: true

  - id: exp.cascade_size_tail
    metric: stat.tail_index("cascade_closed.size", where="size >= 2")
    target: {between: [1.5, 2.5]}
    source: "brief: Actors, posts and cascades (heavy tail); Goel et al. 2016"

  - id: exp.structural_virality
    metric: stat.cascade.structural_virality("repost", node="repost_id",
                                             parent="parent_repost_id", group="post_id",
                                             min_size=100)
    target: {p50: {between: [2.0, 6.0]}}
    source: "brief: Rates we know, row 6 (Goel et al. 2016)"

  # ------------------------------------------------------------ activity
  - id: exp.dau_mau
    metric: stat.dau_mau("session_started", unit="user_id")
    target: {between: [0.35, 0.50]}
    source: "brief: Rates we know, row 7"
    required: true

  - id: exp.posts_per_mau
    metric: stat.quantiles("post_created", per="user_id", window="30d", active_only=true,
                           active_by="session_started")
    target: {p50: {between: [1, 3]}}
    source: "brief: Rates we know, row 8 (Pew 2019)"

  - id: exp.posting_concentration
    metric: stat.top_share("post_created", by="user_id", top=0.10, among="posters")
    target: {between: [0.75, 0.85]}
    source: "brief: Rates we know, row 9 (Pew 2019)"
    required: true

  - id: exp.session_gap_heavy_tail
    metric: stat.tail_index("session_started", per="user_id", gap=true)
    target: {between: [1.1, 1.6]}
    source: "brief: Actors, users (heavy-tailed activity)"

  # ------------------------------------------------------------ engagement
  - id: exp.like_per_impression
    metric: stat.per("like", denom="impression_sampled", weight="sample_weight")
    target: {between: [0.015, 0.04]}
    source: "brief: Rates we know, row 10"
    required: true

  - id: exp.likes_per_repost
    metric: stat.per("like", denom="repost")
    target: {between: [4, 12]}
    source: "brief: Rates we know, row 11"

  - id: exp.exposure_delay
    metric: stat.distribution(between=["post_created", "repost"], unit="post_id",
                              where="depth == 1")
    target: {median_minutes: {between: [20, 90]}, p99_days: {lt: 7}}
    source: "brief: Flows 3"

  # ------------------------------------------------------------ moderation
  - id: exp.report_rate
    metric: stat.per("content_reported", denom="impression_sampled", weight="sample_weight",
                     scale=10000)
    target: {between: [0.5, 3.0]}
    source: "brief: Rates we know, row 12"
    required: true

  - id: exp.action_rate
    metric: stat.share("moderation_decision", of=["moderation_decision"],
                       where="decision != 'no_action'")
    target: {between: [0.15, 0.35]}
    source: "brief: Rates we know, row 13"
    required: true

  - id: exp.review_lag
    metric: stat.distribution(between=["content_reported", "moderation_decision"],
                              unit=["post_id", "reply_id"], first=true)
    target: {median_hours: {lt: 24}, p90_hours: {lt: 72}}
    source: "brief: Rates we know, row 14"
    required: true

# Applied only when the overlay is enabled.
overlays:
  bot_farm:
    - id: exp.bf.cohort_share
      metric: stat.cohort_share("bot_farm", of="user", unit="campaign_id")
      target: {around: "${bot_farm.size}", tolerance: 0.1}
      source: "overlay config"
      required: true
    - id: exp.bf.amplification_latency
      metric: stat.distribution(between=["post_created", "repost"], unit="post_id",
                                where="label.role == 'bot'")
      target: {median_seconds: {between: [5, 30]}}
      source: "brief: Abuse, bot farm (within seconds)"
      required: true
    - id: exp.bf.template_reuse
      metric: stat.share("reply", of=["reply"], where="label.role == 'bot'",
                         duplicated_by="content_hash")
      target: {gt: 0.9}
      source: "brief: Abuse, bot farm (templated replies)"
    - id: exp.bf.some_suspended
      metric: stat.share("label", of=["label"], where="outcome == 'suspended'")
      target: {between: [0.1, 0.8]}
      source: "brief: Abuse, bot farm (some get suspended, others stay active)"
    - id: exp.bf.interference_reported
      metric: stat.interference(base="moderation_decision", cause="moderation")
      target: {reported: true}
      source: "design: overlay regression rule"
      required: true
    - id: exp.bf.graph_interference_reported
      metric: stat.interference(base="repost", cause="follow_graph")
      target: {reported: true}
      source: "design: overlay regression rule"
      required: true
