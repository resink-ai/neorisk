[project]
name = "neorisk"
version = "0.0.0"
description = "neorisk monorepo workspace root (not published)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

# Every directory under libs/ and apps/ with a pyproject.toml is a workspace member.
[tool.uv.workspace]
members = ["libs/*", "apps/*"]

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["libs/*/src", "apps/*/src"]
# plans/specs embed illustrative code blocks; they are not formatted source
extend-exclude = ["docs"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["B008", "RUF009"]
"libs/simkit/tests/fixtures/**" = ["B008", "RUF009"]

[tool.pytest.ini_options]
testpaths = ["libs", "apps"]
markers = [
    "checked: builds or runs the checked engine; run once at the milestone review (-m checked)",
    "large: compiles an ecommerce_s2- or ecommerce-sized module (45-90 min cold)",
]
