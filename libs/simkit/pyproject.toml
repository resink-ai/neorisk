[project]
name = "neorisk-simkit"
version = "0.1.0"
description = "Framework for generating synthetic tabular event data with hidden golden features"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=17",
    "xgboost>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
